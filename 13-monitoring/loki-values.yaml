deploymentMode: SingleBinary

# Disable the caches that are stuck in 'Pending'
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Satisfy the validator: Enable Canary but disable the Test suite
lokiCanary:
  enabled: true 
test:
  enabled: false

# Keep your existing working config below
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

